[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mercadobot-personal"
version = "0.2.0"
description = "Analizador personal multiactivo con memoria, noticias y alertas"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
